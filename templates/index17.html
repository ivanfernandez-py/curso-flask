<!DOCTYPE html>
<html>
<head>
    <title>Eventos</title>
</head>
<body>
    {% for evento in eventos %}
        <h1>Evento #{{ loop.index }}</h1>
        <h2>Evento de {{evento.cliente}}</h2>
        <p>Teléfono: {{evento.telefono}}</p>
        <p>Ordenes: {{evento.ordenes}}</p>
        <p>Fecha: {{evento.fecha}}</p>
        <p>Hora: {{evento.hora}}</p>
        <p>Ubicacion: {{evento.ubicacion}}</p>
    {% endfor %}
</body>
</html>
